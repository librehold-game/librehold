version: 2

# One monthly pull request with the bumps of every ecosystem below.
multi-ecosystem-groups:
  dependencies:
    schedule:
      interval: monthly

updates:
  - package-ecosystem: npm
    directory: /
    patterns: ["*"]
    multi-ecosystem-group: dependencies
  - package-ecosystem: gomod
    directory: /server
    patterns: ["*"]
    multi-ecosystem-group: dependencies
  - package-ecosystem: docker
    directory: /
    patterns: ["*"]
    multi-ecosystem-group: dependencies
  - package-ecosystem: docker-compose
    directories: ["/deploy", "/server"]
    patterns: ["*"]
    multi-ecosystem-group: dependencies
  - package-ecosystem: github-actions
    directory: /
    patterns: ["*"]
    multi-ecosystem-group: dependencies
