services:
  db:
    image: postgres:18.6
    environment:
      POSTGRES_USER: librehold
      POSTGRES_PASSWORD: librehold
      POSTGRES_DB: librehold
    ports:
      - "127.0.0.1:5433:5432"
    volumes:
      - pgdata-dev18:/var/lib/postgresql

  valkey:
    image: valkey/valkey:9.1.2
    ports:
      - "127.0.0.1:6380:6379"

volumes:
  pgdata-dev18:
