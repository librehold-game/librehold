services:
  db:
    image: postgres:18.6@sha256:3a4264520e121176619f54ff867d12774bc81e95e7b84db58d63bccdb6144b81
    environment:
      POSTGRES_USER: librehold
      POSTGRES_PASSWORD: librehold
      POSTGRES_DB: librehold
    ports:
      - "127.0.0.1:5433:5432"
    volumes:
      - pgdata-dev18:/var/lib/postgresql

  valkey:
    image: valkey/valkey:9.1.3@sha256:3add1a336a920ea54770a001ab6feb3da5fceea96a40373a3a2cd469b815f0b7
    ports:
      - "127.0.0.1:6380:6379"

volumes:
  pgdata-dev18:
