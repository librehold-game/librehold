services:
  db:
    image: postgres:18.6@sha256:3a4264520e121176619f54ff867d12774bc81e95e7b84db58d63bccdb6144b81
    environment:
      POSTGRES_USER: librehold
      POSTGRES_PASSWORD: librehold
      POSTGRES_DB: librehold
    ports:
      - "127.0.0.1:5433:5432"
    volumes:
      - pgdata-dev18:/var/lib/postgresql

  valkey:
    image: valkey/valkey:9.1.2@sha256:418652cfb58ef879d4978c33553735d7147016032d5aefaa14c828e611eb9dfd
    ports:
      - "127.0.0.1:6380:6379"

volumes:
  pgdata-dev18:
